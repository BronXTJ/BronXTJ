<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How I work: Sketch, Analyse, Build (hand-written code plus AI agents), Own</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#134e4a"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="230" rx="18" fill="url(#bg)"/>
  <g stroke="#14b8a6" stroke-width="3" stroke-dasharray="8 8" fill="none" filter="url(#glow)">
    <path d="M200 110 H240"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M420 110 H460"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M640 110 H680"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/></path>
  </g>
  <circle r="5" fill="#5eead4" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M40 110 H860"/></circle>
  <g text-anchor="middle">
    <g><rect x="40" y="40" width="160" height="140" rx="14" fill="url(#card)" stroke="#14b8a6" stroke-width="2"><animate attributeName="stroke-opacity" values="1;.3;.3;.3;1" dur="4s" repeatCount="indefinite"/></rect>
      <text x="120" y="82" font-size="30">✏️</text><text x="120" y="115" fill="#f1f5f9" font-size="18" font-weight="700">Sketch</text>
      <text x="120" y="140" fill="#94a3b8" font-size="12">Information architecture</text><text x="120" y="156" fill="#94a3b8" font-size="12">on paper first</text></g>
    <g><rect x="250" y="40" width="160" height="140" rx="14" fill="url(#card)" stroke="#14b8a6" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;1;.3;.3;.3" dur="4s" repeatCount="indefinite"/></rect>
      <text x="330" y="82" font-size="30">🛰️</text><text x="330" y="115" fill="#f1f5f9" font-size="18" font-weight="700">Analyse</text>
      <text x="330" y="140" fill="#94a3b8" font-size="12">GIS and remote sensing</text><text x="330" y="156" fill="#94a3b8" font-size="12">for spatial evidence</text></g>
    <g><rect x="470" y="40" width="170" height="140" rx="14" fill="url(#card)" stroke="#14b8a6" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;.3;1;.3;.3" dur="4s" repeatCount="indefinite"/></rect>
      <text x="555" y="82" font-size="30">⌨️ 🤖</text><text x="555" y="115" fill="#f1f5f9" font-size="18" font-weight="700">Build</text>
      <text x="555" y="140" fill="#94a3b8" font-size="12">Hand-written code + AI</text><text x="555" y="156" fill="#94a3b8" font-size="12">agents in Cursor</text></g>
    <g><rect x="690" y="40" width="170" height="140" rx="14" fill="url(#card)" stroke="#14b8a6" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;.3;.3;1;.3" dur="4s" repeatCount="indefinite"/></rect>
      <text x="775" y="82" font-size="30">✅</text><text x="775" y="115" fill="#f1f5f9" font-size="18" font-weight="700">Own</text>
      <text x="775" y="140" fill="#94a3b8" font-size="12">Design, data reading,</text><text x="775" y="156" fill="#94a3b8" font-size="12">testing, final code</text></g>
  </g>
  <text x="450" y="212" text-anchor="middle" fill="#5eead4" font-size="12" opacity=".8">React · Leaflet · Python · QGIS</text>
</svg>
