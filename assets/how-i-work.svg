<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How I work: Sketch, Analyse, Build (manual plus AI-assisted coding), Own</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#134e4a"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="210" rx="18" fill="url(#bg)"/>
  <g stroke="#14b8a6" stroke-opacity=".35" stroke-width="2">
    <path d="M200 105 H250"/>
    <path d="M410 105 H470"/>
    <path d="M640 105 H690"/>
  </g>
  <g fill="#5eead4" filter="url(#glow)">
    <circle r="3.5" cy="105" opacity="0"><animate attributeName="cx" from="200" to="250" dur="1.2s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="0.0s" repeatCount="indefinite"/></circle>
    <circle r="3.5" cy="105" opacity="0"><animate attributeName="cx" from="200" to="250" dur="1.2s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle r="3.5" cy="105" opacity="0"><animate attributeName="cx" from="200" to="250" dur="1.2s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="3.5" cy="105" opacity="0"><animate attributeName="cx" from="410" to="470" dur="1.2s" begin="0.25s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="0.25s" repeatCount="indefinite"/></circle>
    <circle r="3.5" cy="105" opacity="0"><animate attributeName="cx" from="410" to="470" dur="1.2s" begin="0.65s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="0.65s" repeatCount="indefinite"/></circle>
    <circle r="3.5" cy="105" opacity="0"><animate attributeName="cx" from="410" to="470" dur="1.2s" begin="1.05s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="1.05s" repeatCount="indefinite"/></circle>
    <circle r="3.5" cy="105" opacity="0"><animate attributeName="cx" from="640" to="690" dur="1.2s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle r="3.5" cy="105" opacity="0"><animate attributeName="cx" from="640" to="690" dur="1.2s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle r="3.5" cy="105" opacity="0"><animate attributeName="cx" from="640" to="690" dur="1.2s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="1.3s" repeatCount="indefinite"/></circle>
  </g>
  <g text-anchor="middle">
    <g><rect x="40" y="35" width="160" height="140" rx="14" fill="url(#card)" stroke="#14b8a6" stroke-width="2"><animate attributeName="stroke-opacity" values="1;.3;.3;.3;1" dur="4s" repeatCount="indefinite"/></rect>
      <text x="120" y="82" font-size="30">✏️</text><text x="120" y="115" fill="#f1f5f9" font-size="18" font-weight="700">Sketch</text>
      <text x="120" y="142" fill="#94a3b8" font-size="14">Information architecture</text><text x="120" y="162" fill="#94a3b8" font-size="14">on paper first</text></g>
    <g><rect x="250" y="35" width="160" height="140" rx="14" fill="url(#card)" stroke="#14b8a6" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;1;.3;.3;.3" dur="4s" repeatCount="indefinite"/></rect>
      <text x="330" y="82" font-size="30">🛰️</text><text x="330" y="115" fill="#f1f5f9" font-size="18" font-weight="700">Analyse</text>
      <text x="330" y="142" fill="#94a3b8" font-size="14">GIS and remote sensing</text><text x="330" y="162" fill="#94a3b8" font-size="14">for spatial evidence</text></g>
    <g><rect x="470" y="35" width="170" height="140" rx="14" fill="url(#card)" stroke="#14b8a6" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;.3;1;.3;.3" dur="4s" repeatCount="indefinite"/></rect>
      <text x="555" y="82" font-size="30">⌨️ 🤖</text><text x="555" y="115" fill="#f1f5f9" font-size="18" font-weight="700">Build</text>
      <text x="555" y="142" fill="#94a3b8" font-size="14">Manual +</text><text x="555" y="162" fill="#94a3b8" font-size="14">AI-assisted coding</text></g>
    <g><rect x="690" y="35" width="170" height="140" rx="14" fill="url(#card)" stroke="#14b8a6" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;.3;.3;1;.3" dur="4s" repeatCount="indefinite"/></rect>
      <text x="775" y="82" font-size="30">✅</text><text x="775" y="115" fill="#f1f5f9" font-size="18" font-weight="700">Own</text>
      <text x="775" y="142" fill="#94a3b8" font-size="14">Design, data reading,</text><text x="775" y="162" fill="#94a3b8" font-size="14">testing, final code</text></g>
  </g>
</svg>
